name: Android build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Стабильная подпись нужна, чтобы новые версии ставились поверх старой без потери записей.
      # Если заданы секреты IZ_KEYSTORE_BASE64 и пароли — подписываем своим ключом,
      # иначе используем debug-ключ, который сохраняется в кэше между сборками.
      - name: Restore debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Prepare release keystore
        env:
          KEYSTORE_B64: ${{ secrets.IZ_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "IZ_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          IZ_KEYSTORE_PASSWORD: ${{ secrets.IZ_KEYSTORE_PASSWORD }}
          IZ_KEY_ALIAS: ${{ secrets.IZ_KEY_ALIAS }}
          IZ_KEY_PASSWORD: ${{ secrets.IZ_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "IZRecorder-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: IZRecorder-${{ github.run_number }}
          path: IZRecorder-${{ github.run_number }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: IZ Recorder (сборка ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: Скачайте APK ниже и установите на телефон.
          files: IZRecorder-${{ github.run_number }}.apk
